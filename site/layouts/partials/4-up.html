<div class="bg-off-white pv4">
	<div class="ph3 mw7 center">
		<h2 class="f2 b lh-title mb2">{{.heading}}</h2>
		<p class="mb4">{{.description}}</p>

		<div class="mb3">
			{{ $count := len .blurbs }}
			{{ range $index, $blurb := .blurbs }}
			{{ $isLast := eq (add $index 1) $count }}
			{{ if $isLast }}
			<div class="mb4">
				<div>{{ $blurb.text | markdownify }}</div>
			</div>
			{{ else }}
			<div class="flex-ns items-start mb4">
				<div class="flex-auto">{{ $blurb.text | markdownify }}</div>
				<div class="pl3-ns flex-none">
					<img src="{{ $blurb.image }}" alt="" class="db" style="width: 200px; max-width: 100%;">
				</div>
			</div>
			{{ end }}
			{{ end }}
		</div>
	</div>
</div>
